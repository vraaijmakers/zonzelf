name: ZonZelf CI

on:
  push:
    branches: [main, develop, staging, "feature/**", "bugfix/**", "refactor/**"]
  pull_request:
    branches: [main, develop, staging]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
